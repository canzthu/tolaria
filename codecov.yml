coverage:
  status:
    # Global project and patch statuses are informational only
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Per-surface components with their own patch status
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
      - type: patch
        target: auto
  individual_components:
    # Desktop surface: src-tauri + desktop-specific src/
    - component_id: desktop
      name: Desktop
      paths:
        - src-tauri/**
        - src/**
      flag_regexes:
        - ^rust$
        - ^frontend$
    
    # Web surface: apps/web, apps/server, packages/collab-client
    - component_id: web
      name: Web
      paths:
        - apps/web/**
        - apps/server/**
        - packages/collab-client/**
      flag_regexes:
        - ^frontend$
        - ^server$
    
    # Mobile surface: apps/mobile
    - component_id: mobile
      name: Mobile
      paths:
        - apps/mobile/**
      flag_regexes:
        - ^mobile$
    
    # Shared: packages/protocol, markdown-yjs, vault-index and remaining src/
    - component_id: shared
      name: Shared
      paths:
        - packages/protocol/**
        - packages/markdown-yjs/**
        - packages/vault-index/**
        - src/**
      flag_regexes:
        - ^frontend$

# Carryforward flags for surfaces that may not upload on every commit
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: frontend
      carryforward: true
    - name: rust
      carryforward: true
    - name: server
      carryforward: true
    - name: mobile
      carryforward: true

# Comment settings
comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  hide_project_coverage: false
  require_changes: true
  require_base: true
  require_head: true
